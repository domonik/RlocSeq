primary-file: "run_configs/minusPuroConfig.yml" # path to the config file that will be used first
secondary-file: "run_configs/plusPuroConfig.yml"
tertiary-file: "run_configs/third_config.yml"
total_cell-file: "run_configs/total_cell_config.yml"
why-drop-replicate-file: "run_configs/why_drop_replicate.yml"

membraneColor: "#C60C30"
cytosolColor: "#00338D"

TRACE_COLORS:
  "-p M": "#C60C30"
  "-p C": "#00338D"
  "+p C": "#002244"
  "+p M": "#69BE28"


RNA_TYPE_COLORS:
  5UTR: "#8f6b30"        # Orange Red
  5'UTR: "#8f6b30"        # Orange Red
  3UTR: "rgb(160, 82, 45)"       # Sienna
  3'UTR: "rgb(160, 82, 45)"       # Sienna
  asRNA: "#ffe863"      # Deep Sky Blue
  ncRNA: "rgb(0, 128, 0)"        # Green
  tRNA: "rgb(255, 105, 180)"     # Hot Pink
  CRISPR: "rgb(255, 215, 0)"     # Gold
  mRNA: "#f5c2ed"         # Blue
  CDS: "#f5c2ed"         # Blue
  gene: "rgb(219, 219, 219)"         # Blue
  default: "#7CB9E8"         # Blue

padj_cutoff: 0.05

gff: "initialData/20210217_syne_onlyUnique_withFeat.gff3"
fasta: "initialData/Synechocystis.fasta"


multipanel_font_size: 20

multilevel:
  lfc_cutoff: 0.5
  padj_cutoff: 0.05
  additional_housekeeping_genes: []
  mode: "intersect"

